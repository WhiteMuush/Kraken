name: Bug report
description: Report unexpected behavior in Kraken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please fill in as much
        detail as possible so the issue can be reproduced quickly.

  - type: input
    id: version
    attributes:
      label: Kraken version
      description: "Output of `./kraken.sh --version`"
      placeholder: "Kraken Pentest Framework v1.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Kali 2024.3, Ubuntu 24.04, ..."
    validations:
      required: true

  - type: input
    id: bash
    attributes:
      label: Bash version
      description: "Output of `bash --version | head -1`"
      placeholder: "GNU bash, version 5.2.21(1)-release"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch `./kraken.sh`
        2. Choose module ...
        3. Enter target ...
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste any error messages or stack traces. Redact sensitive data.
      render: shell
